site_name: AI Analytics Governance
site_description: A portable analytics platform with PostgreSQL, dbt and Docker
repo_url: https://github.com/tonycloud40/ai-analytics-governance
repo_name: tonycloud40/ai-analytics-governance

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Workflow: workflow.md
  - Local tools: local-tools.md
  # Shortcuts to tools running on this machine (see docs/local-tools.md).
  # They only work while the stacks are up, and the ports must match
  # PGADMIN_HOST_PORT in docker/postgres/.env and DBT_DOCS_PORT in the Makefile.
  - pgAdmin: http://localhost:15433
  - dbt docs: http://localhost:8080
